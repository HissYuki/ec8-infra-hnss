<!-- Laboratory container: monitors only mounted files, not the host OS. -->
<ossec_config>
  <client>
    <server><address>CHANGE_MANAGER_IP</address><port>CHANGE_MANAGER_PORT</port><protocol>tcp</protocol></server>
    <notify_time>10</notify_time><time-reconnect>10</time-reconnect><auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled><manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port><agent_name>CHANGE_AGENT_NAME</agent_name>
      <authorization_pass_path>etc/authd.pass</authorization_pass_path>
      <server_ca_path>/etc/wazuh-ca.pem</server_ca_path>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>no</disabled><interval>1h</interval><scan_on_start>yes</scan_on_start><os>yes</os><packages>yes</packages><processes>no</processes></wodle>
  <syscheck>
    <disabled>no</disabled><frequency>60</frequency><scan_on_start>yes</scan_on_start>
    <directories realtime="yes" report_changes="no">/monitor/config,/monitor/canary</directories>
    <ignore>/monitor/canary/events.jsonl</ignore>
    <ignore type="sregex">.key$|.pem$|.env$|.log$|.pyc$|.tmp$</ignore>
    <skip_nfs>yes</skip_nfs><skip_dev>yes</skip_dev><skip_proc>yes</skip_proc><skip_sys>yes</skip_sys>
  </syscheck>
  <localfile><log_format>json</log_format><location>/monitor/canary/events.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/monitor/hospital/security.jsonl</location></localfile>
  <active-response><disabled>yes</disabled></active-response>
  <labels><label key="environment">laboratorio-container</label></labels>
</ossec_config>

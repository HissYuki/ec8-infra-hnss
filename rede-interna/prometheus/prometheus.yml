global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter_vlan20'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/vlan20.json']
  - job_name: 'node_exporter_vlan10'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/vlan10.json']
  - job_name: 'node_exporter_vlan40'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/vlan40.json']

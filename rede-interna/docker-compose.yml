services:
  # VLAN20
  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST:?Defina PUBLIC_HOST}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN}
      DJANGO_TRUST_PROXY: 'True'
      DJANGO_SECURE_COOKIES: 'True'
      DJANGO_SSL_REDIRECT: 'True'
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgresql}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BACKEND_MTLS: 'True'
      GUNICORN_BIND: '0.0.0.0:8444'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-hospital@localhost}
      OTP_TOTP_ISSUER: ${OTP_TOTP_ISSUER:-Hospital Nossa Senhora da Saúde}
      PASSWORD_RESET_TIMEOUT: ${PASSWORD_RESET_TIMEOUT:-600}
      MFA_LOGIN_TIMEOUT: ${MFA_LOGIN_TIMEOUT:-600}
      HOSPITAL_SECURITY_LOG: /var/log/hospital/security.jsonl
    volumes:
      - hospital_security_logs:/var/log/hospital
      - ${TLS_DIR:?Defina TLS_DIR}/backend.crt:/run/tls/backend.crt:ro
      - ${TLS_DIR:?Defina TLS_DIR}/backend.key:/run/tls/backend.key:ro
      - ${TLS_DIR:?Defina TLS_DIR}/client-ca.crt:/run/tls/client-ca.crt:ro
    # Comandos pontuais (migrate) precisam resolver PostgreSQL desde o primeiro instante.
    networks:
      db_app:
        priority: 1000
      vlan20:
        priority: 0
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "config.container_health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hashicorp-vault:
    image: hashicorp/vault:latest
    container_name: dados-vault
    depends_on:
      - kms-vault
    ports:
      - "${SECURITY_BIND_IP:-127.0.0.1}:8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: ${VAULT_API_ADDR:-http://hashicorp-vault:8200}
      VAULT_TRANSIT_SEAL_TOKEN: ${VAULT_TRANSIT_SEAL_TOKEN:-}
    cap_add: [IPC_LOCK]
    volumes:
      - vault_data:/vault/file
      - ${VAULT_CONFIG_FILE:?Defina VAULT_CONFIG_FILE}:/vault/config/vault.hcl:ro
    command: server
    networks: [vlan20]
    restart: unless-stopped

  # Cofre persistente que pode fornecer Transit para auto-unseal após configuração.
  kms-vault:
    image: hashicorp/vault:latest
    container_name: kms-vault
    ports:
      - "${KMS_BIND_IP:-127.0.0.1}:${KMS_PORT:-8201}:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: ${KMS_API_ADDR:-http://kms-vault:8200}
    volumes:
      - kms_data:/vault/file
      - ./kms/kms.hcl:/vault/config/kms.hcl:ro
    command: server
    networks:
      - vlan20
    restart: unless-stopped

  postgresql:
    build: ./postgres
    container_name: dados-postgres
    environment:
      POSTGRES_USER: ${INFRA_POSTGRES_USER:-app_admin}
      POSTGRES_PASSWORD: ${INFRA_POSTGRES_PASSWORD:?Defina a senha administrativa do PostgreSQL}
      POSTGRES_DB: ${INFRA_POSTGRES_DB:-dados_db}
      APP_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      APP_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      APP_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      PGBACKREST_PG1_USER: ${INFRA_POSTGRES_USER:-app_admin}
      PGBACKREST_PG1_DATABASE: ${INFRA_POSTGRES_DB:-dados_db}
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --config=/etc/pgbackrest.conf --stanza=hospital archive-push %p"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
      - ./pgbackrest/pgbackrest-dados.conf:/etc/pgbackrest.conf:ro
      - pgbackrest_data:/var/lib/pgbackrest
    networks: [db_app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && test -f /tmp/pgbackrest.ready"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  postgresql-keycloak:
    image: postgres:15-alpine
    container_name: dados-postgres-keycloak
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak_admin}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks: [vlan20]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  node-exporter-dados:
    image: prom/node-exporter:latest
    container_name: node-exporter-vlan20
    ports:
      - "${NODE_EXPORTER_BIND_IP:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - vlan20
    restart: unless-stopped

  # VLAN 30
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: seguranca-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql-keycloak:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_admin}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${SECURITY_BIND_IP:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    networks: [vlan20, vlan30]
    depends_on:
      postgresql-keycloak:
        condition: service_healthy
    restart: unless-stopped
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    hostname: wazuh.manager
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_ADMIN_PASSWORD:?Configure Wazuh}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Configure Wazuh}
    ports:
      - "${WAZUH_BIND_IP:-127.0.0.1}:1514:1514"
      - "${WAZUH_BIND_IP:-127.0.0.1}:1515:1515"
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_api:/var/ossec/api/configuration
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_filebeat:/var/lib/filebeat
      - ./wazuh/config/manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/config/local_rules.xml:/wazuh-config-mount/etc/rules/hospital_rules.xml:ro
      - ${WAZUH_RUNTIME_DIR:?Configure Wazuh}/authd.pass:/wazuh-config-mount/etc/authd.pass:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager.pem:/wazuh-config-mount/etc/sslmanager.cert:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager-key.pem:/wazuh-config-mount/etc/sslmanager.key:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager.pem:/wazuh-config-mount/api/configuration/ssl/server.crt:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager-key.pem:/wazuh-config-mount/api/configuration/ssl/server.key:ro
      - ${WAZUH_RUNTIME_DIR}/certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    networks:
      vlan30: {priority: 1000}
      wazuh_core:
        aliases: [wazuh.manager]
    depends_on:
      wazuh-indexer: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-authd is running'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.8
    hostname: wazuh.indexer
    restart: unless-stopped
    mem_limit: 3g
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - wazuh_indexer:/var/lib/wazuh-indexer
      - ./wazuh/config/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ${WAZUH_RUNTIME_DIR}/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
      - ${WAZUH_RUNTIME_DIR}/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ${WAZUH_RUNTIME_DIR}/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
    networks:
      wazuh_core:
        aliases: [wazuh.indexer]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/wazuh-indexer/config/certs/root-ca.pem --cert /usr/share/wazuh-indexer/config/certs/admin.pem --key /usr/share/wazuh-indexer/config/certs/admin-key.pem 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    hostname: wazuh.dashboard
    restart: unless-stopped
    mem_limit: 1g
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_ADMIN_PASSWORD}
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?Configure Wazuh}
      WAZUH_API_URL: https://wazuh.manager
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD}
      NODE_EXTRA_CA_CERTS: /usr/share/wazuh-dashboard/certs/root-ca.pem
    ports:
      - "${WAZUH_DASHBOARD_BIND_IP:-127.0.0.1}:${WAZUH_DASHBOARD_PORT:-9443}:5601"
    volumes:
      - wazuh_dashboard:/usr/share/wazuh-dashboard/data/wazuh/config
      - ./wazuh/config/dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ${WAZUH_RUNTIME_DIR}/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ${WAZUH_RUNTIME_DIR}/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
    networks:
      vlan30: {priority: 1000}
      wazuh_core: {}
    depends_on:
      wazuh-manager: {condition: service_healthy}
      wazuh-indexer: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/wazuh-dashboard/certs/root-ca.pem https://localhost:5601/ >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  pgbackrest-repo:
    image: alpine:latest
    container_name: seguranca-pgbackrest
    command: ["sleep", "infinity"]
    volumes:
      - pgbackrest_data:/var/lib/pgbackrest:ro
    # Observador do volume compartilhado; não é um servidor remoto de backup.
    networks:
      vlan30: {priority: 1000}
      vlan20: {priority: 0}
    restart: unless-stopped

  prometheus-targets:
    image: alpine:3.22
    network_mode: none
    environment:
      PROMETHEUS_TARGET_VLAN10: ${PROMETHEUS_TARGET_VLAN10:?Defina os exporters da VLAN 10}
      PROMETHEUS_TARGET_VLAN20: ${PROMETHEUS_TARGET_VLAN20:?Defina os exporters da VLAN 20}
      PROMETHEUS_TARGET_VLAN40: ${PROMETHEUS_TARGET_VLAN40:?Defina os exporters da VLAN 40}
    volumes:
      - ./prometheus/prepare-targets.sh:/prepare-targets.sh:ro
      - prometheus_targets:/targets
    command: ["sh", "/prepare-targets.sh"]

  prometheus:
    image: prom/prometheus:latest
    container_name: servicos-prometheus
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - prometheus_targets:/etc/prometheus/targets:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}'
    networks:
      vlan30: {priority: 1000}
    depends_on:
      prometheus-targets: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 20

networks:
  vlan20:
    driver: bridge
    ipam:
      config: [{subnet: "${INTERNAL_DOCKER_SUBNET:-172.28.20.0/24}"}]
  vlan30:
    driver: bridge
    ipam:
      config: [{subnet: "${SECURITY_DOCKER_SUBNET:-172.28.30.0/24}"}]
  vlan40:
    driver: bridge
    ipam:
      config: [{subnet: "${ENDPOINT_DOCKER_SUBNET:-172.28.40.0/24}"}]
  wazuh_core:
    driver: bridge
    internal: true
  db_app:
    driver: bridge
    internal: true

volumes:
  vault_data:
  vault_config:
  kms_data:
  keycloak_db_data:
  postgres_data:

  wazuh_etc:
  wazuh_api:
  wazuh_logs:
  wazuh_queue:
  wazuh_filebeat:
  wazuh_indexer:
  wazuh_dashboard:
  hospital_security_logs:
  pgbackrest_data:
  pgbackrest_config:
  prometheus_data:
  prometheus_targets:

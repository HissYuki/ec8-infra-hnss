services:
  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: ${PUBLIC_HOST:?Defina PUBLIC_HOST}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN}
      DJANGO_TRUST_PROXY: 'True'
      DJANGO_SECURE_COOKIES: 'True'
      DJANGO_SSL_REDIRECT: 'True'
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgresql}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      BACKEND_MTLS: 'True'
      GUNICORN_BIND: '0.0.0.0:8444'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-hospital@localhost}
      OTP_TOTP_ISSUER: ${OTP_TOTP_ISSUER:-Hospital Nossa Senhora da Saúde}
      PASSWORD_RESET_TIMEOUT: ${PASSWORD_RESET_TIMEOUT:-600}
      MFA_LOGIN_TIMEOUT: ${MFA_LOGIN_TIMEOUT:-600}
    volumes:
      - ${TLS_DIR:?Defina TLS_DIR}/backend.crt:/run/tls/backend.crt:ro
      - ${TLS_DIR:?Defina TLS_DIR}/backend.key:/run/tls/backend.key:ro
      - ${TLS_DIR:?Defina TLS_DIR}/client-ca.crt:/run/tls/client-ca.crt:ro
    networks: [vlan20, db_app]
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "config.container_health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  hashicorp-vault:
    image: hashicorp/vault:latest
    container_name: dados-vault
    ports:
      - "${SECURITY_BIND_IP:-127.0.0.1}:8200:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
    cap_add: [IPC_LOCK]
    volumes:
      - vault_data:/vault/file
      - ./vault:/vault/config
    command: server
    networks: [vlan20]
    restart: unless-stopped
  postgresql:
    image: postgres:15-alpine
    container_name: dados-postgres
    environment:
      POSTGRES_USER: ${INFRA_POSTGRES_USER:-app_admin}
      POSTGRES_PASSWORD: ${INFRA_POSTGRES_PASSWORD:?Defina a senha administrativa do PostgreSQL}
      POSTGRES_DB: ${INFRA_POSTGRES_DB:-dados_db}
      APP_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      APP_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      APP_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [db_app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  postgresql-keycloak:
    image: postgres:15-alpine
    container_name: dados-postgres-keycloak
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak_admin}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks: [vlan20]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: seguranca-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql-keycloak:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak_admin}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Defina KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Defina KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${SECURITY_BIND_IP:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    networks: [vlan20, vlan30]
    depends_on:
      postgresql-keycloak:
        condition: service_healthy
    restart: unless-stopped
networks:
  vlan20:
    driver: bridge
    ipam:
      config: [{subnet: "${INTERNAL_DOCKER_SUBNET:-172.28.20.0/24}"}]
  vlan30:
    driver: bridge
    ipam:
      config: [{subnet: "${SECURITY_DOCKER_SUBNET:-172.28.30.0/24}"}]
  vlan40:
    driver: bridge
    ipam:
      config: [{subnet: "${ENDPOINT_DOCKER_SUBNET:-172.28.40.0/24}"}]
  db_app:
    driver: bridge
    internal: true
volumes:
  vault_data:
  vault_config:
  keycloak_db_data:
  postgres_data:

# Desenvolvimento local. A imagem web também pode ser executada separadamente.
services:
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?Defina POSTGRES_HOST no .env}
      POSTGRES_PORT: ${POSTGRES_PORT:?Defina POSTGRES_PORT no .env}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-hospital@localhost}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      PASSWORD_RESET_TIMEOUT: ${PASSWORD_RESET_TIMEOUT:-600}
      MFA_LOGIN_TIMEOUT: ${MFA_LOGIN_TIMEOUT:-600}
      OTP_TOTP_ISSUER: ${OTP_TOTP_ISSUER:-Hospital Nossa Senhora da Saúde}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    # Montagens explícitas mantêm os diretórios de infraestrutura fora do container.
    volumes:
      - ./manage.py:/app/manage.py
      - ./config:/app/config
      - ./accounts:/app/accounts
      - ./pacientes:/app/pacientes
      - ./medicos:/app/medicos
      - ./coordenador:/app/coordenador
      - ./consultas:/app/consultas
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:

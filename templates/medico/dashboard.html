{% extends "base.html" %}

{% block title %}
Minha Agenda
{% endblock %}


{% block extra_css %}

<link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css"
    rel="stylesheet"
>

{% endblock %}


{% block content %}

<div class="dashboard-header">

    <div>

        <h2>
            Agenda do Dr(a). {{ user.get_full_name }}
        </h2>

        <p>
            Consulte abaixo suas consultas agendadas.
        </p>

    </div>

</div>


<div class="calendar-card">

    <div id="calendario-medico">
    </div>

</div>

{% endblock %}


{% block extra_js %}

<script
    src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js">
</script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const elementoCalendario =
            document.getElementById(
                "calendario-medico"
            );


        const calendario =
            new FullCalendar.Calendar(
                elementoCalendario,
                {
                    initialView: "timeGridWeek",

                    locale: "pt-br",

                    timeZone:"local",

                    height: 850,

                    slotMinTime: "06:00:00",

                    slotMaxTime: "20:30:00",

                    slotDuration: "00:30:00",
                    
                    slotLabelInterval: "00:30:00",

                    slotLabelFormat: {
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false
                    },

                    eventTimeFormat: {
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false
                    },

                    allDaySlot: false,

                    nowIndicator: true,

                    expandRows: true,

                    headerToolbar: {
                        left: "prev,next today",
                        center: "title",
                        right: "dayGridMonth,timeGridWeek,timeGridDay"
                    },

                    buttonText: {
                        today: "Hoje",
                        month: "Mês",
                        week: "Semana",
                        day: "Dia"
                    },

                    events:
                        "{% url 'medicos:consultas_calendario' %}",
                }
            );


        calendario.render();

    }
);

</script>

{% endblock %}
